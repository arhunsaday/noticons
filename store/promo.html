<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noticon store assets</title>
<!--
  Source of truth for the store promo tiles. Each .tile is exactly the pixel
  size the store asks for, so `node scripts/store-assets.mjs` can screenshot
  them one at a time with no cropping.
-->
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#e9e9e7;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  body[data-only] .tile{display:none}
  body[data-only="small"] #small,
  body[data-only="marquee"] #marquee{display:flex}
  body[data-only] {background:none}
  body[data-only] .wrap{padding:0;gap:0}
  .wrap{display:flex;flex-direction:column;align-items:flex-start;gap:24px;padding:24px}
  .tile{
    display:flex;align-items:center;overflow:hidden;position:relative;
    background:#1F1F1E;color:#fff;
  }
  .tile::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 140% at 88% 12%, rgba(35,131,226,.34), transparent 58%);
  }
  .inner{position:relative;z-index:1;display:flex;align-items:center}
  #small{width:440px;height:280px;padding:34px}
  #small .inner{flex-direction:column;align-items:flex-start;gap:18px}
  #small .logo{width:76px;height:76px}
  #small .name{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}
  #small .tag{font-size:14px;line-height:1.45;color:rgba(255,255,255,.62);max-width:300px}
  #marquee{width:1400px;height:560px;padding:96px}
  #marquee .inner{gap:56px}
  #marquee .logo{width:200px;height:200px;flex-shrink:0}
  #marquee .name{font-size:96px;font-weight:700;letter-spacing:-3.5px;line-height:1}
  #marquee .tag{font-size:28px;line-height:1.5;color:rgba(255,255,255,.62);margin-top:18px;max-width:640px}
  .chips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .chip{
    font-size:18px;padding:8px 16px;border-radius:999px;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);
  }
  #small .chips{margin-top:0;gap:6px}
  #small .chip{font-size:11px;padding:4px 9px}
</style>
</head>
<body>
<div class="wrap">

  <div class="tile" id="small">
    <div class="inner">
      <img class="logo" src="../brand/logo.svg" alt="">
      <div>
        <div class="name">Noticon</div>
        <div class="tag">39,819 icons, inside Notion’s own page-icon menu.</div>
      </div>
      <div class="chips"><span class="chip">Offline</span><span class="chip">No account</span><span class="chip">No tracking</span></div>
    </div>
  </div>

  <div class="tile" id="marquee">
    <div class="inner">
      <img class="logo" src="../brand/logo.svg" alt="">
      <div>
        <div class="name">Noticon</div>
        <div class="tag">39,819 icons, inside Notion’s own page-icon menu. Search, tint, click once.</div>
        <div class="chips"><span class="chip">Offline catalogue</span><span class="chip">No account</span><span class="chip">No tracking</span></div>
      </div>
    </div>
  </div>

</div>
<script>
  // ?only=small renders that tile alone at its exact size, which is what the
  // capture script screenshots.
  const only = new URLSearchParams(location.search).get('only');
  if (only) document.body.dataset.only = only;
</script>
</body>
</html>

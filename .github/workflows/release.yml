name: Release

# Tag a version to ship it:
#   npm version minor && git push --follow-tags
#
# Every publishing step is skipped when its credentials are absent, so the
# workflow still produces a GitHub Release on a fork or before the store
# accounts exist. See store/DEPLOY.md for how to obtain each secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach artefacts without publishing to the stores
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can reproduce from the repository.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "Tag $TAG != package.json $PKG"; exit 1; }

      - name: Test
        run: npm test

      - name: Brand assets are up to date
        run: |
          npm run brand
          git diff --exit-code -- extension/icons brand

      - name: Build and package
        run: npm run package

      - name: Publish to the Chrome Web Store
        if: env.CWS_CLIENT_ID != '' && env.DRY_RUN != 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source releases/noticons-chrome-v*.zip --auto-publish

      - name: Submit to Firefox Add-ons
        if: env.AMO_JWT_ISSUER != '' && env.DRY_RUN != 'true'
        run: |
          npx --yes web-ext@8 sign \
            --channel=listed \
            --source-dir=dist-firefox \
            --artifacts-dir=releases \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"

      - name: Skipped publishing
        if: env.CWS_CLIENT_ID == '' || env.AMO_JWT_ISSUER == ''
        run: echo "::notice::Store credentials missing — artefacts were built but not published. See store/DEPLOY.md."

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
          body: |
            Install from the [Chrome Web Store](https://chrome.google.com/webstore/detail/${{ secrets.CWS_EXTENSION_ID }}) or [Firefox Add-ons](https://addons.mozilla.org/addon/noticons/).

            The attached archives are the exact packages submitted to both stores.

      - uses: actions/upload-artifact@v4
        with:
          name: noticons-releases
          path: releases

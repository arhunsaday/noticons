<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noticon — integration fixture</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{
    --bg:#fff; --side:#f7f7f5; --ink:rgb(55,53,47); --muted:rgba(55,53,47,.5);
    --line:rgba(55,53,47,.09); --pop:#fff; --hover:rgba(55,53,47,.06);
    background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  body.notion-dark-theme{
    --bg:rgb(25,25,25); --side:rgb(32,32,32); --ink:rgba(255,255,255,.81); --muted:rgba(255,255,255,.44);
    --line:rgba(255,255,255,.094); --pop:rgb(37,37,37); --hover:rgba(255,255,255,.055);
    color-scheme:dark;
  }
  aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--side);padding:14px 12px;font-size:14px;color:var(--muted)}
  aside strong{display:block;color:var(--ink);font-size:14px;font-weight:600;padding:6px 8px;margin-bottom:14px}
  aside a{display:block;padding:5px 8px;border-radius:4px;color:inherit;text-decoration:none}
  aside a:hover{background:var(--hover)}
  main{max-width:900px;margin:0 auto;padding:96px 96px 80px 336px}
  .page-icon{font-size:78px;line-height:1;border:0;background:none;padding:0;cursor:pointer;border-radius:6px}
  .page-icon:hover{background:var(--hover)}
  .page-icon img{width:78px;height:78px;display:block}
  h1{font-size:40px;font-weight:700;letter-spacing:-.6px;margin:12px 0 18px}
  p{color:var(--muted);max-width:60ch}
  .popup{
    position:absolute;top:214px;left:340px;width:420px;background:var(--pop);border-radius:10px;
    box-shadow:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 3px 6px,rgba(15,15,15,.2) 0 9px 24px;
  }
  .tabs{display:flex;padding:6px;gap:1px;border-bottom:1px solid var(--line)}
  .tabs button{position:relative;border:0;background:none;padding:7px 8px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;border-radius:4px}
  /* Mirrors how Notion marks the selected tab: colour change plus a straight rule. */
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:1px;background:currentColor}
  .tabs button:hover{background:var(--hover)}
  .native-content{padding:18px;height:230px}
  .emoji-grid{font-size:26px;line-height:1.9;letter-spacing:6px}
  .bar{position:fixed;bottom:18px;right:20px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
  .bar button{font:inherit;font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--pop);color:var(--ink);cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <aside>
    <strong>◈ Personal workspace</strong>
    <a href="#">⌕&nbsp;&nbsp;Search</a>
    <a href="#">⌂&nbsp;&nbsp;Home</a>
    <a href="#">▤&nbsp;&nbsp;Projects</a>
    <a href="#">✦&nbsp;&nbsp;Creative space</a>
  </aside>

  <main>
    <button class="page-icon" aria-label="Change page icon">🌿</button>
    <h1>A space for good ideas.</h1>
    <p>Click the page icon, then choose <strong>More icons</strong>.</p>
  </main>

  <div class="popup" hidden>
    <div class="tabs">
      <button role="tab">Emojis</button>
      <button role="tab" class="on">Icons</button>
      <button role="tab">Upload</button>
    </div>
    <div class="native-content">
      <div class="emoji-grid">🌿 ✨ 🚀 📚 🎨 💡<br>🌈 🪴 ☕ 🧭 🎧 🏔️</div>
    </div>
  </div>

  <div class="bar">
    <span>Integration fixture · not a live Notion page</span>
    <button id="theme" type="button">Toggle dark</button>
  </div>

  <script type="module" src="demo.js"></script>
</body>
</html>
